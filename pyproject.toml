[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oes-coordination-lab"
version = "0.1.0"
description = "SYNTHETIC toy benchmark: local disturbances versus system-wide shocks under no, private and shared regime information."
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-only"
authors = [{ name = "Jean-François Brisson" }]
dependencies = [
  "finite-game-equilibria @ git+https://github.com/sparkainlp-x/finite-game-equilibria@f92deb37abfe605a8c986e0d409b1b2ac2fdc572",
]

[project.scripts]
oes-coordination-lab = "oes_coordination.__main__:main"

[tool.setuptools]
packages = ["oes_coordination"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["error"]
