name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: JSON CLI smoke test
        run: |
          python -m oes_coordination --seeds 0 1 --calibration-episodes 5 --evaluation-episodes 10 > "$RUNNER_TEMP/results.json"
          python -c 'import json, os; r=json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "results.json"))); assert r["sample_counts"]["evaluation_total"] == 60; assert len(r["toy_games"]["coordination"]["pure_equilibria"]) == 2; assert not r["toy_games"]["matching_pennies"]["has_pure_equilibrium"]'
